<script>
(() => {
  const duration = 3600, easeOut = 'cubic-bezier(.16,1,.3,1)', flow = 'cubic-bezier(.76,0,.2,1)';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const params = new URLSearchParams(location.search);
  if (params.has('film')) document.documentElement.classList.add('film');
  const scene = $('.scene'), stage = $('.stage'), timeline = $('.timeline');
  let animations = [], raf = 0, running = false, baseTime = 0, start = 0, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const K = (ms, values, easing) => ({offset:ms/duration,...values,...(easing?{easing}:{})});
  function animate(target, frames) {
    const node = typeof target === 'string' ? $(target) : target;
    const animation = node.animate(frames,{duration,fill:'both',easing:'linear'});
    animation.pause();animation.currentTime=0;animations.push(animation);
  }
  function fit(){scene.style.transform=`scale(${stage.clientWidth/1280},${stage.clientHeight/800})`;}
  new ResizeObserver(fit).observe(stage);fit();
  $('.word').replaceChildren(...[...'Stringmoon'].map(letter=>{const span=document.createElement('span');span.textContent=letter;return span;}));
  [[405,218],[817,177],[893,381],[368,437],[822,465],[482,130],[930,265]].forEach(([x,y],i)=>{
    const s=document.createElement('div');s.className='star';s.style.left=x+'px';s.style.top=y+'px';s.dataset.delay=i;scene.insertBefore(s,$('.hero'));
  });
  function build(){
    animations.forEach(a=>a.cancel());animations=[];
    if(reduced){
      animate('.app-screen',[K(0,{opacity:0}),K(250,{opacity:0}),K(650,{opacity:1}),K(duration,{opacity:1})]);
      animate('.hero',[K(0,{opacity:1,transform:'scale(.63)'}),K(300,{opacity:1,transform:'scale(.63)'}),K(650,{opacity:0,transform:'scale(.63)'}),K(duration,{opacity:0,transform:'scale(.63)'})]);
      animate('.girl',[K(0,{opacity:1}),K(duration,{opacity:1})]);
      animate('.moon-reveal',[K(0,{opacity:1}),K(duration,{opacity:1})]);
      return;
    }
    animate('.atmosphere',[K(0,{opacity:0}),K(900,{opacity:1}),K(2450,{opacity:1}),K(3180,{opacity:0})]);
    animate('.seed',[K(0,{opacity:0,transform:'scale(0)'}),K(140,{opacity:1,transform:'scale(1.1)'}),K(380,{opacity:1,transform:'scale(.65)'}),K(700,{opacity:0,transform:'scale(.2)'})]);
    animate('.plucked-string',[K(0,{opacity:0,transform:'scaleX(0)'}),K(90,{opacity:0,transform:'scaleX(.02)',},easeOut),K(390,{opacity:.9,transform:'scaleX(1)'}),K(630,{opacity:0,transform:'scaleX(.94)'})]);
    animate('.wave',[K(0,{opacity:0,transform:'scaleY(.1)'}),K(190,{opacity:0,transform:'scaleY(.1)'}),K(330,{opacity:.65,transform:'scaleY(1)'}),K(670,{opacity:0,transform:'scaleY(.04)'})]);
    animate('.ring-track',[K(0,{strokeDashoffset:1006,opacity:0}),K(270,{strokeDashoffset:1006,opacity:.7},easeOut),K(1120,{strokeDashoffset:0,opacity:.65}),K(2300,{strokeDashoffset:0,opacity:.6}),K(2750,{strokeDashoffset:0,opacity:0})]);
    animate('.ring',[K(0,{opacity:0,transform:'rotate(-160deg) scale(.78)'}),K(270,{opacity:1,transform:'rotate(-160deg) scale(.78)'},easeOut),K(1170,{opacity:1,transform:'rotate(-90deg) scale(1)'}),K(2350,{opacity:.8,transform:'rotate(-70deg) scale(1.035)'}),K(2800,{opacity:0,transform:'rotate(-48deg) scale(1.16)'})]);
    animate('.ring .lit',[K(0,{strokeDashoffset:1006}),K(270,{strokeDashoffset:1006},easeOut),K(1400,{strokeDashoffset:-150}),K(2380,{strokeDashoffset:-300}),K(2800,{strokeDashoffset:-430})]);
    animate('.halo',[K(0,{opacity:0,transform:'scale(.7)'}),K(580,{opacity:0,transform:'scale(.7)'},easeOut),K(1420,{opacity:1,transform:'scale(1)'}),K(2300,{opacity:.85,transform:'scale(1.03)'}),K(2900,{opacity:0,transform:'scale(1.15)'})]);
    animate('.moon',[K(0,{opacity:0,transform:'translateY(26px) scale(.78)'}),K(330,{opacity:0,transform:'translateY(26px) scale(.78)'},easeOut),K(1100,{opacity:1,transform:'translateY(0px) scale(1)'}),K(2240,{opacity:1,transform:'translateY(0px) scale(1)'}),K(2840,{opacity:0,transform:'translateY(0px) scale(.58)'},flow),K(duration,{opacity:0,transform:'translateY(0px) scale(.58)'})]);
    $$('.moon-band').forEach((band,i)=>animate(band,[K(0,{transform:`translateY(${16+i*5}px)`,opacity:0}),K(390+i*45,{transform:`translateY(${16+i*5}px)`,opacity:0},easeOut),K(1000+i*42,{transform:'translateY(0px)',opacity:1})]));
    animate('.girl',[K(0,{opacity:0,transform:'translate(8px,22px)'}),K(620,{opacity:0,transform:'translate(8px,22px)'},easeOut),K(1370,{opacity:1,transform:'translate(0px,0px)'}),K(2280,{opacity:1,transform:'translate(0px,0px)'}),K(2720,{opacity:0,transform:'translate(0px,-6px)'})]);
    animate('.orbital-space',[K(0,{opacity:0,transform:'rotate(-26deg) scale(.68)'}),K(450,{opacity:0,transform:'rotate(-26deg) scale(.68)'},easeOut),K(1400,{opacity:.85,transform:'rotate(-19deg) scale(1)'}),K(2260,{opacity:.65,transform:'rotate(-16deg) scale(1.025)'}),K(2700,{opacity:0,transform:'rotate(-12deg) scale(1.1)'})]);
    $$('.star').forEach((star,i)=>animate(star,[K(0,{opacity:0,transform:'scale(.4)'}),K(900+i*60,{opacity:0,transform:'scale(.4)'}),K(1450+i*30,{opacity:i%2?.36:.16,transform:'scale(1)'}),K(2320,{opacity:.16,transform:'scale(1)'}),K(2690,{opacity:0,transform:'scale(.5)'})]));
    $$('.word span').forEach((span,i)=>animate(span,[K(0,{opacity:0,transform:'translateY(18px)'}),K(980+i*30,{opacity:0,transform:'translateY(18px)'},easeOut),K(1600+i*22,{opacity:1,transform:'translateY(0px)'}),K(2280+i*8,{opacity:1,transform:'translateY(0px)'}),K(2680+i*8,{opacity:0,transform:'translateY(-12px)'})]));
    animate('.sub',[K(0,{opacity:0,transform:'translateY(7px)'}),K(1450,{opacity:0,transform:'translateY(7px)'},easeOut),K(1950,{opacity:1,transform:'translateY(0px)'}),K(2360,{opacity:1,transform:'translateY(0px)'}),K(2710,{opacity:0,transform:'translateY(-5px)'})]);
    animate('.bottom-signature',[K(0,{opacity:0}),K(1450,{opacity:0}),K(1950,{opacity:1}),K(2250,{opacity:1}),K(2630,{opacity:0})]);

    animate('.hero',[K(0,{opacity:1,transform:'translate(0px,0px) scale(1)'}),K(2320,{opacity:1,transform:'translate(0px,0px) scale(1)'},flow),K(2990,{opacity:1,transform:'translate(-220px,-70px) scale(.62)'}),K(3400,{opacity:0,transform:'translate(-220px,-70px) scale(.62)'})]);
    animate('.app-screen',[K(0,{opacity:0,transform:'translateY(4px) scale(1.006)'}),K(2910,{opacity:0,transform:'translateY(4px) scale(1.006)'},easeOut),K(3600,{opacity:1,transform:'translateY(0px) scale(1)'})]);
  }
  function update(t){
    timeline.value=t;timeline.style.setProperty('--progress',`${t/duration*100}%`);$('.time').textContent=`${(t/1000).toFixed(2)} / 3.60 s`;
    $('.play').innerHTML=running?'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="2"/></svg>':'<svg viewBox="0 0 24 24"><path class="filled" d="m8 5 11 7-11 7z"/></svg>';
    $('.play').setAttribute('aria-label',running?'暂停预览':'播放预览');
    const chapter=t<600?0:t<1650?1:t<2450?2:3;$$('.chapter').forEach((c,i)=>c.classList.toggle('active',i===chapter));
    $('.skip').hidden=t>=duration;
  }
  function current(){return Math.min(duration,Math.max(0,running?baseTime+performance.now()-start:baseTime));}
  function tick(){const t=current();update(t);if(t>=duration){running=false;baseTime=duration;update(t);raf=0;return;}raf=requestAnimationFrame(tick);}
  function pause(){baseTime=current();running=false;cancelAnimationFrame(raf);raf=0;animations.forEach(a=>{a.pause();a.currentTime=baseTime});update(baseTime);}
  function seek(t){pause();baseTime=Math.max(0,Math.min(duration,t));animations.forEach(a=>a.currentTime=baseTime);update(baseTime);}
  function play(){if(running)return;if(baseTime>=duration)seek(0);running=true;start=performance.now();animations.forEach(a=>{a.currentTime=baseTime;a.play()});cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);update(baseTime);}
  function replay(){seek(0);play();}
  $('.play').onclick=()=>running?pause():play();$('.replay').onclick=replay;timeline.oninput=()=>seek(Number(timeline.value));$('.skip').onclick=()=>seek(duration);
  $$('.chapter').forEach(button=>button.onclick=()=>seek(Number(button.dataset.time)));
  function setReduced(value){pause();reduced=value;$('.mode').setAttribute('aria-pressed',String(reduced));build();seek(0);play();}
  $('.mode').onclick=()=>setReduced(!reduced);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();running?pause():play();}if(e.key.toLowerCase()==='r')replay();if(e.key==='Escape')seek(duration);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.motionPreview={seek,play,pause,replay,setReduced,duration,get state(){return {time:current(),running,reduced,animationCount:animations.length,frameScheduled:Boolean(raf)}}};
  build();$('.mode').setAttribute('aria-pressed',String(reduced));seek(Number(params.get('t')||0));
  $('.app-screen').decode().catch(()=>{}).then(()=>{window.previewReady=true;if(!params.has('t'))setTimeout(play,300);});
})();
</script>
</body>
</html>
